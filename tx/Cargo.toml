[package]
name = "tx"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-csi-rs = { version = "0.6.0", default-features = false, features = ["no-std", "println", "auto", "esp32s3"] }
esp-hal = { version = "1.1", features = ["esp32s3", "rt", "unstable"] }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "sniffer", "esp-alloc", "unstable", "esp-now", "csi"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
esp-alloc = "0.10"
esp-backtrace = { version = "0.18", features = ["esp32s3", "println", "panic-handler"] }
esp-println = { version = "0.18", features = ["esp32s3", "auto"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
embassy-executor = { version = "0.10.0", features = ["task-arena-size-65536"] }
embassy-time = "0.5.0"
embassy-futures = "0.1"
static_cell = "2"
portable-atomic = "1"

[profile.release]
debug = 2
debug-assertions = false
opt-level = "s"
lto = "fat"
overflow-checks = false
